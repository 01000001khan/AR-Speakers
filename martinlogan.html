<!DOCTYPE html>
<html lang="en">
<head>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><!---->

<body>
  <div class="container">
    <form action="/index.html">

    <form action="/motion.html">

    <p>Statement 40XW</p>
    <model-viewer ar ar-modes="webxr scene-viewer quick-look" autoplay camera-controls shadow-intensity="1" shadow-softness="1" enable-pan auto-rotate src="assets/models/martinlogan/masterpiece/Statement 40XW.glb">

    <p>Dynamo IW-O</p>
